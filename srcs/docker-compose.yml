secrets:
  db_admin_password:
    file: ../secrets/db_admin_password
  db_user_password:
    file: ../secrets/db_user_password
  wp_admin_password:
    file: ../secrets/wp_admin_password
  wp_user_password:
    file: ../secrets/wp_user_password

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - db_user_password
      - db_admin_password
    ports:
      - "3306"
    networks:
      - inception
    volumes:
      - mariadb_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: on-failure

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_volume:/var/www/html
    depends_on:
      wordpress:
        condition: service_healthy
    restart: on-failure

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    expose:
      - "9000"
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - wordpress_volume:/var/www/html
    secrets:
      - db_admin_password
      - db_user_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
     test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
     interval: 10s
     timeout: 3s
     retries: 3
     start_period: 10s
    restart: on-failure

networks:
  inception:
    driver: bridge

volumes:
  wordpress_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abdothma/data/wordpress

  mariadb_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abdothma/data/mariadb
